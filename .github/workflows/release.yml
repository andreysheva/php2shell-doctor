name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: "1.22"
      - name: Tests must pass before release
        run: |
          go vet ./...
          go test ./...
          go run ./cmd/php2shell-doctor self-test
      - name: Build all platforms (reproducible, no deps)
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64; do
            export GOOS="${t%/*}"
            export GOARCH="${t#*/}"
            go build -trimpath -ldflags "-s -w -X main.toolVersion=${GITHUB_REF_NAME}" \
              -o "dist/php2shell-doctor-${GOOS}-${GOARCH}" ./cmd/php2shell-doctor || exit 1
          done
          # Guard: five different platforms must produce five different
          # binaries (catches cross-compilation env not being applied).
          n=$(sha256sum dist/php2shell-doctor-* | awk '{print $1}' | sort -u | wc -l)
          [ "$n" -eq 5 ] || { echo "expected 5 distinct binaries, got $n"; exit 1; }
          cd dist && sha256sum * > checksums.txt
      - name: Cosign sign artifacts (keyless)
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
      - run: |
          for f in dist/php2shell-doctor-* dist/checksums.txt; do
            cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
          done
      - name: Publish release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            dist/php2shell-doctor-*
            dist/checksums.txt*
          generate_release_notes: true
